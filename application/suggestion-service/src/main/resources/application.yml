spring:
  application:
    name: suggestion-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/typeahead}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  flyway:
    enabled: false
app:
  index:
    max-queries: 1000
    max-suggestions: 10
    weights:
      all-time: 1.0
      recent: 1.0
  builder:
    rebuild-interval-ms: 5000
  redis:
    nodes: ${APP_REDIS_NODES:redis:6379}
    command-timeout-ms: 2000
    liveness-interval-ms: 5000
  ring:
    vnodes: 150
  cache:
    base-ttl-seconds: 15
    jitter-seconds: 3
server:
  port: 8081
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    distribution:
      percentiles-histogram:
        suggest.request: true
      percentiles:
        suggest.request: 0.5, 0.95, 0.99
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
info:
  app:
    name: suggestion-service
    version: ${APP_VERSION:local}
