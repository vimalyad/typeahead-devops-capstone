name: assignment-s21
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: 70:70
    environment:
      POSTGRES_DB: typeahead
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U app -d typeahead
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 192m
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: 999:999
    command:
    - redis-server
    - --maxmemory
    - 16mb
    - --maxmemory-policy
    - allkeys-lru
    - --save
    - ''
    - --appendonly
    - 'no'
    tmpfs:
    - /data:uid=999,gid=999
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 64m
  kafka:
    image: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
    user: 1000:1000
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: '1'
      KAFKA_LOG_SEGMENT_BYTES: '16777216'
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
    - kafkadata:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        >/dev/null
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    mem_limit: 640m
  ingestion-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: ingestion-service
        VERSION: ${APP_VERSION:-local}
    image: typeahead-capstone-ingestion-service:${APP_VERSION:-local}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/typeahead
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?Set a temporary DATABASE_PASSWORD
        outside Git}
      APP_VERSION: ${APP_VERSION:-local}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
    - 127.0.0.1:18782:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 512m
    read_only: true
    tmpfs:
    - /tmp:uid=65532,gid=65532,size=64m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  suggestion-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: suggestion-service
        VERSION: ${APP_VERSION:-local}
    image: typeahead-capstone-suggestion-service:${APP_VERSION:-local}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/typeahead
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?Set a temporary DATABASE_PASSWORD
        outside Git}
      APP_VERSION: ${APP_VERSION:-local}
      APP_REDIS_NODES: redis:6379
    ports:
    - 127.0.0.1:18781:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    read_only: true
    tmpfs:
    - /tmp:uid=65532,gid=65532,size=64m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: typeahead-capstone-frontend:${APP_VERSION:-local}
    ports:
    - 127.0.0.1:${FRONTEND_PORT:-3000}:8080
    depends_on:
    - ingestion-service
    - suggestion-service
    mem_limit: 48m
    read_only: true
    tmpfs:
    - /tmp:uid=101,gid=101,size=16m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
volumes:
  pgdata: {}
  kafkadata: {}
