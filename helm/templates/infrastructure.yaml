apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: postgres
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      containers:
      - name: postgres
        image: '{{ .Values.infrastructure.postgres.image }}'
        ports:
        - name: tcp
          containerPort: 5432
        resources:
          requests:
            cpu: 30m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: POSTGRES_DB
          value: typeahead
        - name: POSTGRES_USER
          value: app
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Values.databaseSecret }}'
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - app
            - -d
            - typeahead
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - app
            - -d
            - typeahead
          initialDelaySeconds: 30
          periodSeconds: 10
  serviceName: postgres
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: '{{ .Values.storageClass }}'
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - name: tcp
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: kafka
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kafka
        image: '{{ .Values.infrastructure.kafka.image }}'
        ports:
        - name: tcp
          containerPort: 9092
        - name: controller
          containerPort: 9093
        resources:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            cpu: '1'
            memory: 640Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: CLUSTER_ID
          value: MkU3OEVBNTcwNTJENDM2Qk
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka:9093
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka:9092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: '0'
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data/logs
        - name: KAFKA_LOG_RETENTION_HOURS
          value: '1'
        - name: KAFKA_LOG_SEGMENT_BYTES
          value: '16777216'
        - name: KAFKA_HEAP_OPTS
          value: -Xms128m -Xmx256m
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        startupProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 10
  serviceName: kafka
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: '{{ .Values.storageClass }}'
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
  - name: tcp
    port: 9092
    targetPort: 9092
  - name: controller
    port: 9093
    targetPort: 9093
  clusterIP: None
  # KRaft must resolve its controller address before broker readiness can pass.
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: redis
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 32Mi
      containers:
      - name: redis
        image: '{{ .Values.infrastructure.redis.image }}'
        ports:
        - name: tcp
          containerPort: 6379
        resources:
          requests:
            cpu: 30m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        args:
        - --maxmemory
        - 16mb
        - --maxmemory-policy
        - allkeys-lru
        - --save
        - ''
        - --appendonly
        - 'no'
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
  - name: tcp
    port: 6379
    targetPort: 6379
