{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: typeahead
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      - path: /api/search
        pathType: Prefix
        backend:
          service:
            name: ingestion-service
            port:
              number: 8082
      - path: /api/queries
        pathType: Prefix
        backend:
          service:
            name: ingestion-service
            port:
              number: 8082
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: suggestion-service
            port:
              number: 8081
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
{{- end }}
