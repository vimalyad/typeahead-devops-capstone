server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /health { access_log off; return 200 "ok\n"; }
    location /api/search { proxy_pass http://ingestion-service:8082; }
    location /api/queries { proxy_pass http://ingestion-service:8082; }
    location /api/ { proxy_pass http://suggestion-service:8081; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}
